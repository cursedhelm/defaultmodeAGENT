version = 1

[*]
parallel = 1
n-gpu-layers = auto
fit = on
fit-target = 1536
flash-attn = on
jinja = true
load-on-startup = false

[qwen-3.8-27b]
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
ctx-size = 65536
batch-size = 1024
ubatch-size = 512
cache-type-k = q8_0
cache-type-v = q8_0
no-mmproj = true
spec-default = true
spec-type = draft-mtp
spec-draft-n-max = 2
reasoning = on
reasoning-effort = medium
reasoning-budget = 4096
reasoning-budget-message = I have reached my reasoning budget. I will now answer with the best supported conclusion.
reasoning-preserve = true
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
load-on-startup = true

[muse-glimmer-30b]
